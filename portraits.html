    <script>
        // 等待網頁上所有資源 (包括所有圖片檔案) 都載入完成後再執行
        window.onload = function() {
            var grid = document.querySelector('.masonry-grid-js');
            
            // 初始化 Masonry
            var msnry = new Masonry( grid, {
                // 指定哪一個 div 才是相片項目
                itemSelector: '.masonry-item',
                // 設定為百分比寬度，讓它在縮放螢幕時可以正確響應
                percentPosition: true,
                // 設定欄位的間距由樣式表 (padding) 決定
                columnWidth: '.masonry-item',
                // 減少空隙
                gutter: 0,
                // 自動對齊，盡量消除凹凸
                horizontalOrder: true
            });
        };
    </script>

<div id="globalImageModal" class="fixed inset-0 z-50 hidden bg-black/90 flex items-center justify-center backdrop-blur-sm cursor-zoom-out">
        <button id="closeGlobalModal" class="absolute top-6 right-8 text-white text-5xl font-light hover:text-gray-300 transition-colors">&times;</button>
        <img id="globalModalImg" class="max-w-[92vw] max-h-[88vh] object-contain rounded-lg p-2 transition-transform duration-300" src="" alt="Enlarged View">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('globalImageModal');
            const modalImg = document.getElementById('globalModalImg');
            const closeBtn = document.getElementById('closeGlobalModal');

            // 抓取頁面上所有的圖片
            const allImages = document.querySelectorAll('img');

            allImages.forEach(img => {
                // 💡 自動過濾：如果是導航欄、Footer 的大頭貼、或 Next Project 的小縮圖，就不啟用放大功能
                if (
                    img.closest('footer') || 
                    img.closest('nav') || 
                    img.classList.contains('w-16') || 
                    img.classList.contains('w-12')
                ) {
                    return; 
                }

                // 幫符合條件的專案大圖加上放大鏡手勢與微互動
                img.classList.add('cursor-zoom-in', 'hover:opacity-95', 'transition-all', 'duration-200');

                // 監聽點擊事件
                img.addEventListener('click', () => {
                    modalImg.src = img.src;
                    modalImg.alt = img.alt;
                    modal.classList.remove('hidden');
                    // 加上禁止身體滾動，避免放大時背景還能偷滾動
                    document.body.style.overflow = 'hidden';
                });
            });

            // 關閉燈箱的函式
            const hideModal = () => {
                modal.classList.add('hidden');
                modalImg.src = '';
                document.body.style.overflow = ''; // 恢復滾動
            };

            // 點擊關閉按鈕、或是點擊黑底背景時，都能關閉
            modal.addEventListener('click', (e) => {
                if (e.target === modal || e.target === closeBtn || e.target === modalImg) {
                    hideModal();
                }
            });

            // 鍵盤個人化：按 ESC 鍵也能貼心關閉
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && !modal.classList.contains('hidden')) {
                    hideModal();
                }
            });
        });
    </script>
